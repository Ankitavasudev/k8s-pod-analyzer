name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o k8s-pod-analyzer .

      - name: Analyze the bundled sample
        run: |
          ./k8s-pod-analyzer analyze examples/sample.log --timeline
          ./k8s-pod-analyzer analyze examples/sample.log -o json > out.json
          grep -q '"total_lines": 10' out.json
          grep -q '"error_count": 4' out.json
          ./k8s-pod-analyzer analyze examples/sample.log -o csv > out.csv
          grep -q 'error_count,4' out.csv
          ./k8s-pod-analyzer analyze examples/sample.log -l error | grep -q 'Errors: 4'
          cat examples/sample.log | ./k8s-pod-analyzer analyze -

      - name: Check the HTML report
        run: |
          ./k8s-pod-analyzer analyze examples/incident.log -o html > report.html
          grep -q '<!DOCTYPE html>' report.html
          grep -q 'connection reset by peer' report.html
          # The report must work offline: no scripts, no external requests.
          ! grep -q '<script' report.html
          ! grep -qE '(<link|<img|src="http)' report.html
